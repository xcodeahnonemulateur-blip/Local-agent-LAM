plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nathandev.localagent'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nathandev.localagent'
        minSdk 24
        targetSdk 36
        versionCode providers.gradleProperty('playVersionCode').getOrElse('2').toInteger()
        versionName providers.gradleProperty('playVersionName').getOrElse('0.2.0')
        testInstrumentationRunner 'com.nathandev.localagent.BridgeSmokeInstrumentation'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Offline QR decoding. The scanned payload is never contacted automatically.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
